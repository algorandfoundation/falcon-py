# Local hooks that run the ruff pinned in uv.lock (via `uv run`), so the hook,
# CI, and a manual `uv run ruff` can never disagree about the ruff version.
# The ruff-pre-commit mirror, by contrast, would pin a second version here.
#
# One-time setup per machine: `uvx pre-commit install` (after `uv sync`).
# `--no-sync` skips re-resolving the environment on every commit; it assumes
# `uv sync` has run once, which the Development setup already requires.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
